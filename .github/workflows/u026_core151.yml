name: U026 Core151 provenance and integration
on:
  push:
    branches: [Development]
  pull_request:
    branches: [Core]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core151-python:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: .
      PYTHONDONTWRITEBYTECODE: '1'
    defaults:
      run:
        working-directory: Founders_CIV_CoreCompletion151/source/world023024
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact source fingerprints and no generated artifacts
        id: provenance
        continue-on-error: true  # run regressions despite drift; fail gate below
        working-directory: .
        run: python tools/u026_g0_drift_audit.py
      - name: Record exact G0 candidate source hashes
        working-directory: .
        run: |
          sha256sum Founders_CIV_CoreCompletion151/source/world023024/founders_civ/core/founder_harvesting.py
          sha256sum Founders_CIV_CoreCompletion151/source/world023024/founders_civ/experimental/world_integration.py
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest==8.4.1
      - name: Generate deterministic observatory fixture only in CI workspace
        run: python -c "import json; from pathlib import Path; from founders_civ.runner import run; Path('web/sample_run.json').write_text(json.dumps(run(42,30,'1111')))"
      - name: Run full Core151 WORLD-024 regression
        run: python -m pytest -q tests
      - name: Enforce provenance gate after regressions
        if: always()
        env:
          PROVENANCE_OUTCOME: ${{ steps.provenance.outcome }}
        run: |
          if [ "$PROVENANCE_OUTCOME" != success ]; then
            echo 'G0 provenance FAILED; regression evidence retained, promotion blocked.'
            exit 1
          fi

  worldbox-source-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: M05 virtual observer sidecar tests (not the Core151 Book)
        working-directory: FoundersCIV_WorldBox_M05_Integration
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -v
      - name: M01 snapshot/identity bridge tests
        working-directory: Founders_CIV_WorldBox_M01
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -v
