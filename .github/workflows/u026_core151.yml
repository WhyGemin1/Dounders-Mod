name: U026 Core151 provenance and integration
on:
  push:
    branches: [Development]
  pull_request:
    branches: [Core]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core151-python:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: .
      PYTHONDONTWRITEBYTECODE: '1'
    defaults:
      run:
        working-directory: Founders_CIV_CoreCompletion151/source/world023024
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact source fingerprints and no generated artifacts
        working-directory: .
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          manifest = json.loads(Path('docs/U026_C018_SOURCE_FINGERPRINT.json').read_text())
          assert manifest['files'] == 494
          for rel, expected in manifest['sha256'].items():
              actual = hashlib.sha256(Path(rel).read_bytes()).hexdigest()
              assert actual == expected, f'Core source drift: {rel}'
          prohibited = [p for p in Path('.').rglob('*') if p.is_file() and
              (p.suffix.lower() in {'.dll','.pdb','.pyc','.sqlite','.db','.exe','.log'} or
              any(part in {'__pycache__','obj','bin','.pytest_cache'} for part in p.parts))]
          assert not prohibited, f'Generated artifacts present: {prohibited[:5]}'
          print('G0 exact source: 494/494 SHA-256 matches, no prohibited artifacts')
          PY
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest==8.4.1
      - name: Run full Core151 WORLD-024 regression
        run: python -m pytest -q tests
