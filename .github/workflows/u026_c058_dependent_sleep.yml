name: U026 C058 dependent sleep acceptance
on:
  push:
    branches: [Development]
    paths:
      - 'Founders_CIV_CoreCompletion151/source/src/core_physiology_v2.py'
      - 'tests/test_u026_c058_dependent_sleep.py'
      - '.github/workflows/u026_c058_dependent_sleep.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run actual Core151 dependent physiology tests
        run: python -m unittest discover -s tests -p 'test_u026_c058_dependent_sleep.py' -v
